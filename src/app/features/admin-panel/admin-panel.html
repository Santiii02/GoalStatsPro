<div class="container fade-in mt-5">
    <div class="header-admin mb-4">
        <h2><i class="pi pi-lock text-primary mr-2"></i> Panel de Administración</h2>
        <p class="text-muted">Gestión de usuarios y permisos de GoalStatsPro</p>
    </div>

    <p-table [value]="users" [loading]="loading" [rows]="10" [paginator]="true"
        styleClass="p-datatable-striped shadow-2 rounded overflow-hidden">
        <ng-template pTemplate="header">
            <tr>
                <th scope="col">Email</th>
                <th scope="col">Rol</th>
                <th scope="col">Equipos</th>
                <th scope="col">Jugadores</th>
                <th scope="col" style="width: 100px">Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{ user.email || 'Sin email' }}</td>
                <td>
                    <p-tag [severity]="user.role === 'admin' ? 'danger' : 'info'"
                        [value]="user.role === 'admin' ? 'ADMIN' : 'USUARIO'">
                    </p-tag>
                </td>
                <td>
                    <span class="text-sm">
                        {{ user.favoriteTeams?.length || 0 }} equipos
                    </span>
                </td>
                <td>
                    <span class="text-sm">
                        {{ user.favoritePlayers?.length || 0 }} jugadores
                    </span>
                </td>
                <td>
                    <p-button *ngIf="user.role !== 'admin'" icon="pi pi-trash"
                        styleClass="p-button-rounded p-button-danger p-button-text" (onClick)="deleteUser(user.uid)"
                        pTooltip="Borrar usuario datos">
                    </p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">No se han encontrado usuarios registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
