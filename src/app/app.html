<div class="app-container">
  <nav class="navbar">
    <div class="nav-brand">
      <a routerLink="/">GoalStatsPro</a>
    </div>

    <div class="nav-search">
      <app-navbar></app-navbar>
    </div>

    <ul class="nav-links">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      </li>
      <li>
        <a routerLink="/matches" routerLinkActive="active">Partidos</a>
      </li>
      <li>
        <a routerLink="/teams" routerLinkActive="active">Equipos</a>
      </li>
      <li>
        <a routerLink="/players" routerLinkActive="active">Jugadores</a>
      </li>
      <li>
        <div class="auth-widget">
          <ng-container *ngIf="authService.user$ | async as user; else loggedOut">
            <div class="user-info" style="display: flex; align-items: center; gap: 8px;">
              <p-button *ngIf="isAdmin" icon="pi pi-cog" routerLink="/admin"
                styleClass="p-button-rounded p-button-text p-button-secondary" pTooltip="Panel Admin"
                tooltipPosition="bottom">
              </p-button>

              <i class="pi pi-user user-icon"></i>
              <span class="user-email" style="font-size: 0.85rem; font-weight: bold;">{{ user.email }}</span>
              <p-button icon="pi pi-sign-out" (onClick)="logout()"
                styleClass="p-button-rounded p-button-text p-button-danger" pTooltip="Cerrar sesión"
                tooltipPosition="bottom">
              </p-button>
            </div>
          </ng-container>

          <ng-template #loggedOut>
            <p-button label="Entrar" icon="pi pi-sign-in" routerLink="/login"
              styleClass="p-button-rounded p-button-primary p-button-sm">
            </p-button>
          </ng-template>
        </div>
      </li>
    </ul>
  </nav>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/santiago-infante-ramos-255579208/" target="_blank" rel="noopener noreferrer"
        title="Mi perfil de LinkedIn">
        <i class="pi pi-linkedin"></i>
      </a>

      <a href="https://github.com/Santiii02/GoalStatsPro" target="_blank" rel="noopener noreferrer"
        title="Código fuente en GitHub">
        <i class="pi pi-github"></i>
      </a>

      <a href="mailto:sir1003@alu.ubu.es" title="Contactar por Email">
        <i class="pi pi-envelope"></i>
      </a>
    </div>

    <p class="copyright-text">
      <a href="https://www.linkedin.com/in/santiago-infante-ramos-255579208/" target="_blank" rel="noopener noreferrer">
        &copy; 2026 GoalStatsPro
      </a>
    </p>
  </footer>
</div>
