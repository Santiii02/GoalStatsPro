<div class="search-widget">
  
  <div class="search-box">
    <p-autoComplete 
      [(ngModel)]="selectedItem" 
      [suggestions]="filteredItems" 
      (completeMethod)="search($event)" 
      (onSelect)="onSelect($event)"
      field="strTeam" 
      placeholder="Buscar equipo o jugador..."
      [forceSelection]="true"
      scrollHeight="350px"
      minLength="2">

      <ng-template let-item pTemplate="item">
        <div class="suggestion-item flex align-items-center gap-3 py-1">
          <div class="suggestion-img-wrapper">
              <img [src]="item.type === 'team' ? (item.strTeamBadge || item.strBadge) : (item.strThumb || item.strCutout)" 
                  onerror="this.src='assets/images/Logo.png'" alt="logo" />
          </div>
          <div class="flex flex-column text-left">
            <span class="font-bold suggestion-name" style="font-size: 0.95rem; color: #334155;">
                {{ item.type === 'team' ? item.strTeam : item.strPlayer }}
            </span>
            <span class="suggestion-type" [ngClass]="item.type">
                {{ item.type === 'team' ? 'Equipo' : 'Jugador' }}
            </span>
          </div>
        </div>
      </ng-template>

      <ng-template pTemplate="empty">
        <div class="empty-search-msg">
          <i class="pi pi-search-minus mb-2"></i>
          <p class="font-bold m-0" style="color: #475569;">No se encontraron resultados</p>
          <small class="text-muted mt-2 block" style="line-height: 1.4;">
            💡 <strong>Tip:</strong> Para equipos internacionales, prueba a buscar su nombre en inglés (ej: <em>Bayern Munich</em> o <em>Red Star</em>).
          </small>
        </div>
      </ng-template>
    </p-autoComplete>
  </div>
</div>
